# Boot the real game with each changed mod on self-hosted runners. See docs/test-pipeline.md.
# linux: the homelab fleet's runner. windows: off until repository variable CK2_SMOKE_WINDOWS is
# true (no Windows runner is planned; tools/smoke.ps1 is for checks by hand).
name: smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: windows smoke
    # Fork pull requests never reach the self-hosted runner (this repository is public), and
    # Renovate's pull requests are skipped: they change no mod.
    if: >-
      vars.CK2_SMOKE_WINDOWS == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'renovate[bot]' &&
        !startsWith(github.head_ref, 'renovate/')))
    runs-on: [self-hosted, windows, ck2]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Smoke changed mods
        shell: powershell
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $all = Get-ChildItem mods -Directory | Where-Object { $_.Name -notlike '_*' } | ForEach-Object Name
          $mods = $all
          if ($env:EVENT -ne 'workflow_dispatch' -and $env:BASE_SHA -and $env:BASE_SHA -notmatch '^0+$') {
            $changed = git diff --name-only "$env:BASE_SHA" HEAD -- mods
            $mods = $all | Where-Object { $m = $_; $changed | Where-Object { $_ -like "mods/$m/*" -or $_ -eq "mods/$m.mod" } }
          }
          if (-not $mods) { Write-Host 'no mod changed'; exit 0 }
          $common = @{}
          if ($env:CK2_GAME_DIR) { $common.GameDir = $env:CK2_GAME_DIR }
          if ($env:CK2_USER_DIR) { $common.UserDir = $env:CK2_USER_DIR }
          if (-not (Test-Path "$env:LOCALAPPDATA\ck2-mods\smoke\_baseline\error.log")) {
            & .\tools\smoke.ps1 -Baseline @common
          }
          $failed = @()
          foreach ($m in $mods) {
            & .\tools\smoke.ps1 $m @common
            if ($LASTEXITCODE -ne 0) { $failed += $m }
          }
          New-Item -ItemType Directory -Force smoke-reports | Out-Null
          foreach ($m in $mods) { Copy-Item -Recurse -Force "$env:LOCALAPPDATA\ck2-mods\smoke\$m" "smoke-reports\$m" }
          if ($failed) { Write-Host "failed: $($failed -join ', ')"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: smoke-reports
          if-no-files-found: ignore

  static:
    name: linux static
    # Lint, cross-references and CWTools with the game's own files, which GitHub-hosted runners lack.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'renovate[bot]' &&
       !startsWith(github.head_ref, 'renovate/'))
    runs-on: [self-hosted, linux, ck2]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Tools on the runner
        id: tools
        run: |
          for t in python3 cwtools dotnet xdotool; do printf '%-8s %s\n' "$t" "$(command -v "$t" || echo missing)"; done
          python3 --version 2>&1 || true
          for t in python3 cwtools; do
            if command -v "$t" >/dev/null; then
              echo "$t=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::the runner image lacks $t, so its checks were skipped (docs/test-pipeline.md, Linux runner)"
            fi
          done
          ln -sfn "${CK2_GAME_DIR:-/game}" vanilla
          echo "vanilla/ -> $(readlink vanilla): $(find -L vanilla/events vanilla/decisions vanilla/common -name '*.txt' | wc -l) script files, $(find -L vanilla/localisation -name '*.csv' | wc -l) localisation files"
      - name: Lint and cross-references with the game's files
        if: steps.tools.outputs.python3 == 'true'
        run: python3 tools/lint.py
      - name: CWTools with the game's files
        if: ${{ !cancelled() && steps.tools.outputs.python3 == 'true' && steps.tools.outputs.cwtools == 'true' }}
        run: python3 tools/cwtools_check.py --strict

  linux:
    name: linux smoke
    # Same guards as the windows job: no fork pull requests, no Renovate.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'renovate[bot]' &&
       !startsWith(github.head_ref, 'renovate/'))
    runs-on: [self-hosted, linux, ck2]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Smoke changed mods
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # Every mod on a manual run, when the smoke itself changed, or when git cannot say what
          # changed; otherwise only the changed ones, and nothing when no mod changed.
          mods=()
          if [ "$EVENT" != workflow_dispatch ] && [[ $BASE_SHA =~ ^[0-9a-f]{40}$ && ! $BASE_SHA =~ ^0+$ ]] &&
             changed=$(git diff --name-only "$BASE_SHA" HEAD) &&
             ! grep -qxE 'tools/(smoke|install)\.sh|\.github/workflows/smoke\.yml' <<<"$changed"; then
            for d in mods/*/; do
              d=${d%/}; d=${d#mods/}
              if [[ $d != _* ]] && grep -qE "^mods/$d(/|\.mod$)" <<<"$changed"; then mods+=("$d"); fi
            done
            if [ "${#mods[@]}" -eq 0 ]; then echo 'no mod changed'; exit 0; fi
          fi
          tools/smoke.sh "${mods[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: smoke-reports
          if-no-files-found: ignore
