# Push a tag <mod_folder>-v<version> (e.g. allied_fleets-v0.1.0) to publish
# dist/<mod_folder>.zip as a GitHub release. Multiplayer players install the
# same release so their checksums match.
name: release
on:
  push:
    tags: ["*-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        id: build
        run: |
          tag="${GITHUB_REF_NAME}"
          mod="${tag%-v*}"
          test -d "mods/$mod" || { echo "no mods/$mod for tag $tag"; exit 1; }
          python3 tools/lint.py "$mod"
          python3 tools/package.py "$mod"
          echo "mod=$mod" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/${{ steps.build.outputs.mod }}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes
