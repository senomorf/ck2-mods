# Runtime smoke (roadmap #13, step 2): play an in-game year with each changed mod on the fleet
# runner, from a save vanilla made, and fail on new error.log lines that name the mod. See
# tools/campaign.sh and docs/test-pipeline.md.
name: campaign
on:
  push:
    branches: [main]
    paths:
      - mods/**
      - tools/campaign.sh
      - tools/campaign/**
      - tools/harness.py
      - tests/game/**
      - .github/workflows/campaign.yml
  pull_request:
    paths:
      - mods/**
      - tools/campaign.sh
      - tools/campaign/**
      - tools/harness.py
      - tests/game/**
      - .github/workflows/campaign.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: campaign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  campaign:
    name: linux campaign
    # Same guard as smoke.yml: fork pull requests never reach the self-hosted runner, and
    # Renovate's are skipped.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'renovate[bot]' &&
       !startsWith(github.head_ref, 'renovate/'))
    runs-on: [self-hosted, linux, ck2]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Play a year with the changed mods
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # Every mod on a manual run, when the campaign test itself changed, or when git cannot
          # say what changed; otherwise the mods whose files or in-game tests changed, and nothing when
          # none did.
          mods=()
          if [ "$EVENT" != workflow_dispatch ] && [[ $BASE_SHA =~ ^[0-9a-f]{40}$ && ! $BASE_SHA =~ ^0+$ ]] &&
             changed=$(git diff --name-only "$BASE_SHA" HEAD) &&
             ! grep -qE '^(tools/campaign(\.sh|/)|tools/harness\.py$|\.github/workflows/campaign\.yml$)' <<<"$changed"; then
            for d in mods/*/; do
              d=${d%/}; d=${d#mods/}
              if [[ $d != _* ]] && grep -qE "^(mods/$d(/|\.mod$)|tests/game/$d/)" <<<"$changed"; then mods+=("$d"); fi
            done
            if [ "${#mods[@]}" -eq 0 ]; then echo 'no mod changed'; exit 0; fi
          fi
          tools/campaign.sh "${mods[@]}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: campaign-linux
          path: campaign-reports/
          if-no-files-found: warn
