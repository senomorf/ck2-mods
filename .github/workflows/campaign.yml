# Runtime smoke (roadmap #13, steps 2 to 4): play an in-game year with each changed mod on the
# fleet runner, from a save vanilla made or one the mod's previous version made, and fail on new
# error.log lines that name the mod or failed in-game tests. See tools/campaign.sh and
# docs/test-pipeline.md.
name: campaign
on:
  push:
    branches: [main]
    paths:
      - mods/**
      - tools/campaign.sh
      - tools/campaign/**
      - tools/harness.py
      - tools/ck2save.py
      - tests/game/**
      - .github/workflows/campaign.yml
  pull_request:
    paths:
      - mods/**
      - tools/campaign.sh
      - tools/campaign/**
      - tools/harness.py
      - tools/ck2save.py
      - tests/game/**
      - .github/workflows/campaign.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: campaign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  campaign:
    name: linux campaign
    # Same guard as smoke.yml: fork pull requests never reach the self-hosted runner, and
    # Renovate's are skipped.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'renovate[bot]' &&
       !startsWith(github.head_ref, 'renovate/'))
    runs-on: [self-hosted, linux, ck2]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Vanilla's run and base versions' saves from earlier runs (tools/campaign.sh,
      # CAMPAIGN_CACHE). Saved after the run even when a mod fails, since vanilla's part is good.
      - name: Restore the campaign cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .campaign-cache
          key: campaign-${{ hashFiles('tools/campaign.sh', 'tools/campaign/**') }}-${{ github.event.pull_request.base.sha || github.event.before || 'manual' }}
          restore-keys: |
            campaign-${{ hashFiles('tools/campaign.sh', 'tools/campaign/**') }}-
      - name: Play a year with the changed mods
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # Every mod on a manual run, when the campaign test itself changed, or when git cannot
          # say what changed; otherwise the mods whose files or in-game tests changed, and nothing when
          # none did.
          mods=()
          if [ "$EVENT" != workflow_dispatch ] && [[ $BASE_SHA =~ ^[0-9a-f]{40}$ && ! $BASE_SHA =~ ^0+$ ]] &&
             changed=$(git diff --name-only "$BASE_SHA" HEAD) &&
             ! grep -qE '^(tools/campaign(\.sh|/)|tools/harness\.py$|\.github/workflows/campaign\.yml$)' <<<"$changed"; then
            for d in mods/*/; do
              d=${d%/}; d=${d#mods/}
              if [[ $d != _* ]] && grep -qE "^(mods/$d(/|\.mod$)|tests/game/$d/)" <<<"$changed"; then mods+=("$d"); fi
            done
            if [ "${#mods[@]}" -eq 0 ]; then echo 'no mod changed'; exit 0; fi
          fi
          # A mod the base commit already has plays a year in that version first; this version
          # then loads its save (tools/campaign.sh, CAMPAIGN_BASE).
          if [ "$EVENT" != workflow_dispatch ] && [[ $BASE_SHA =~ ^[0-9a-f]{40}$ && ! $BASE_SHA =~ ^0+$ ]] &&
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            export CAMPAIGN_BASE=$BASE_SHA
          fi
          export CAMPAIGN_CACHE=$PWD/.campaign-cache
          tools/campaign.sh "${mods[@]}"
      - name: Save the campaign cache
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' && hashFiles('.campaign-cache/vanilla/start.ck2') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .campaign-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: campaign-linux
          path: campaign-reports/
          if-no-files-found: warn
