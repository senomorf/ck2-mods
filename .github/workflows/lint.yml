name: lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tool tests
        run: python3 -m unittest discover -s tests -v
      - name: Lint mods
        run: python3 tools/lint.py
      - name: Shell scripts
        run: shellcheck tools/*.sh .claude/hooks/*.sh
      - name: No game files committed
        run: |
          if git ls-files | grep -q '^vanilla/\|^reference/'; then echo "vanilla/ and reference/ must not be committed"; exit 1; fi
