name: lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Tool tests
        run: python3 -m unittest discover -s tests -v
      - name: Lint mods
        run: python3 tools/lint.py
      - name: Pinned linters (tools/cloud_setup.sh, the versions cloud sessions get)
        run: |
          sudo bash tools/cloud_setup.sh shellcheck actionlint
          /usr/local/bin/shellcheck --version
          /usr/local/bin/actionlint --version
      - name: Shell scripts
        run: /usr/local/bin/shellcheck tools/*.sh .claude/hooks/*.sh
      - name: Workflows
        run: /usr/local/bin/actionlint
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem tools -Filter *.ps1) {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e) | Out-Null
            foreach ($x in $e) { Write-Host "$($f.Name): $x"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: No game files committed
        run: |
          if git ls-files | grep -q '^vanilla/\|^reference/'; then echo "vanilla/ and reference/ must not be committed"; exit 1; fi
